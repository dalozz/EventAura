<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eventaura AI | Transform Event Photos into Stunning AI Art</title>
    <link rel="stylesheet" href="./index.css" />
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Framer Motion (CDN) -->
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>
    <!-- Babel so the browser can read JSX in .jsx files (fine for demos) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      // make framer-motion available as "motion" for our component file
      window.motion = window.framerMotion.motion;
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Load your component and mount script (both as JSX) -->
    <script type="text/babel" src="./EventauraSite.jsx"></script>
    <script type="text/babel" src="./index.js"></script>
  </body>
</html>
